name: Build Moodle Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout Moodle App source
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js using Moodle App .nvmrc
      # --------------------------------------------------
      - name: Read Node.js version
        id: node-version
        shell: bash
        run: |
          NODE_VERSION=$(cat .nvmrc)
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using Node.js $NODE_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.NODE_VERSION }}
          cache: npm

      # --------------------------------------------------
      # 3. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 4. Check environment
      # --------------------------------------------------
      - name: Check versions
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Java version:"
          java -version

      # --------------------------------------------------
      # 5. Install Moodle App dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # --------------------------------------------------
      # 6. Build web application
      # --------------------------------------------------
      - name: Build Moodle web application
        run: npm run build

      # --------------------------------------------------
      # 7. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android project directory was not found."
            echo "The Moodle App Android project has not been generated."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew was not found."
            exit 1
          fi

          echo "Android project found successfully."

      # --------------------------------------------------
      # 8. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # --------------------------------------------------
      # 9. Build APK directly with Gradle
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # --------------------------------------------------
      # 10. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: moodle-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
