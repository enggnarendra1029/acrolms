name: Free Android App Compiler
on: [push, workflow_dispatch]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Upgraded to match moodlemobile@5.3.0 requirements

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Installed with engine legacy fallback to prevent setup interruption
      - run: npm install --legacy-peer-deps --no-engine-strict

      - run: npx cap add android

      - run: npm run build -- --configuration=production

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: free-moodle-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
