name: Free Android App Compiler
on: [push, workflow_dispatch]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Install local packages including Capacitor binaries
      - run: npm install --legacy-peer-deps --no-engine-strict

      # Fix: Call local capacitor binary instead of global npx lookup
      - run: ./node_modules/.bin/cap add android

      - run: npm run build -- --configuration=production

      # Fix: Call local capacitor binary for sync execution
      - run: ./node_modules/.bin/cap sync android

      - run: chmod +x android/gradlew

      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: free-moodle-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
