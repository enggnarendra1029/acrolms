name: Free Android App Compiler
on: [push, workflow_dispatch]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Clean installation to ensure dependencies deploy correctly
      - run: npm ci --legacy-peer-deps --no-engine-strict || npm install --legacy-peer-deps --no-engine-strict

      # Use the direct npm script bundled inside Moodle's package.json
      - run: npm run dev:android

      - run: chmod +x android/gradlew

      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: free-moodle-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
